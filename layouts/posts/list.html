<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}

  <main class="section">
    <div class="container">
      <h1 class="page-title">{{ .Title }}</h1>
      {{- with .Description }}
      <p class="page-sub">{{ . }}</p>
      {{- end }}
      {{- with .Pages.ByDate.Reverse }}
      {{ partial "post-list.html" . }}
      {{- else }}
      <p class="page-sub">{{ i18n "no_posts" }}</p>
      {{- end }}
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
