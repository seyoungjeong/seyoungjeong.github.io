<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="640" height="440" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="30" y="30" width="240" height="90" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="150" y="56" text-anchor="middle" font-weight="600" fill="#1f2937">Gazebo (gz sim 8)</text>
<text x="150" y="76" text-anchor="middle" fill="#4b5563">x500 드론, FTS 전용 센서</text>
<text x="150" y="94" text-anchor="middle" fill="#4b5563">모터, 낙하산 플러그인</text>
<text x="150" y="110" text-anchor="middle" fill="#4b5563" font-size="11">IMU 100 Hz, GNSS 10 Hz, 기압 20 Hz</text>
<rect x="370" y="30" width="240" height="90" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="490" y="56" text-anchor="middle" font-weight="600" fill="#1f2937">PX4 SITL</text>
<text x="490" y="76" text-anchor="middle" fill="#4b5563">오토파일럿 (비행 제어)</text>
<text x="490" y="94" text-anchor="middle" fill="#4b5563">FTS는 PX4를 믿지 않음</text>
<line x1="272" y1="75" x2="368" y2="75" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="320" y="66" text-anchor="middle" fill="#4b5563" font-size="11">센서 / 모터 명령</text>
<rect x="170" y="175" width="300" height="84" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="320" y="200" text-anchor="middle" font-weight="600" fill="#1f2937">I/O 브리지 (C++)</text>
<text x="320" y="220" text-anchor="middle" fill="#4b5563">센서를 프레임으로 전달, heartbeat 전달</text>
<text x="320" y="238" text-anchor="middle" fill="#4b5563">모터 게이트(릴레이), 낙하산 발사</text>
<text x="320" y="252" text-anchor="middle" fill="#4b5563" font-size="11">실제 기체라면 배선과 릴레이에 해당</text>
<line x1="150" y1="122" x2="250" y2="173" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="178" y="158" text-anchor="end" fill="#4b5563" font-size="11">센서, 모터, 낙하산</text>
<line x1="490" y1="122" x2="390" y2="173" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="462" y="158" fill="#4b5563" font-size="11">MAVLink heartbeat</text>
<rect x="30" y="325" width="240" height="90" rx="8" fill="#fff5e6" stroke="#d98a1c"/>
<text x="150" y="351" text-anchor="middle" font-weight="600" fill="#1f2937">FTS 펌웨어</text>
<text x="150" y="371" text-anchor="middle" fill="#4b5563">Zephyr 4.4.2, native_sim</text>
<text x="150" y="389" text-anchor="middle" fill="#4b5563">종료 판단, 릴레이, 낙하산</text>
<text x="150" y="405" text-anchor="middle" fill="#4b5563" font-size="11">판단 로직은 순수 C</text>
<line x1="250" y1="261" x2="150" y2="323" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="176" y="290" text-anchor="end" fill="#1f2937">링크 1 (PTY)</text>
<text x="176" y="305" text-anchor="end" fill="#4b5563" font-size="11">센서, heartbeat / 출력</text>
<rect x="370" y="325" width="240" height="90" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="490" y="351" text-anchor="middle" font-weight="600" fill="#1f2937">지상국 (ROS 2 Humble)</text>
<text x="490" y="371" text-anchor="middle" fill="#4b5563">ARM, 수동 종료, 상태 표시</text>
<text x="490" y="389" text-anchor="middle" fill="#4b5563">시나리오 러너, rosbag2</text>
<line x1="272" y1="370" x2="368" y2="370" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="320" y="361" text-anchor="middle" fill="#1f2937">링크 2 (PTY)</text>
<text x="320" y="387" text-anchor="middle" fill="#4b5563" font-size="11">명령 / 상태</text>
</svg>
