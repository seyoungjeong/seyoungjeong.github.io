<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 420" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="690" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="20" y="40" width="170" height="110" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="105" y="68" text-anchor="middle" font-weight="600" fill="#1f2937">GitHub Actions</text>
<text x="105" y="90" text-anchor="middle" fill="#4b5563">워크플로, 작업 대기열</text>
<text x="105" y="108" text-anchor="middle" fill="#4b5563">빌드 산출물</text>
<text x="105" y="126" text-anchor="middle" fill="#4b5563">결과, 로그</text>
<rect x="232" y="18" width="438" height="384" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/>
<text x="248" y="40" fill="#6b7280" font-size="12">사무실 벤치 (분리된 네트워크)</text>
<rect x="258" y="60" width="170" height="110" rx="8" fill="#fff5e6" stroke="#d98a1c"/>
<text x="343" y="88" text-anchor="middle" font-weight="600" fill="#1f2937">자체 러너</text>
<text x="343" y="110" text-anchor="middle" fill="#4b5563">라즈베리 파이 또는 PC</text>
<text x="343" y="128" text-anchor="middle" fill="#4b5563">플래시·시험 스크립트</text>
<text x="343" y="146" text-anchor="middle" fill="#6b7280" font-size="11">시험 전용 계정</text>
<line x1="192" y1="95" x2="256" y2="112" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="24" y="170" fill="#4b5563" font-size="11">러너가 먼저 연결</text>
<text x="24" y="186" fill="#4b5563" font-size="11">(나가는 HTTPS만,</text>
<text x="24" y="202" fill="#4b5563" font-size="11">방화벽 열 필요 없음)</text>
<rect x="490" y="60" width="160" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="570" y="88" text-anchor="middle" font-weight="600" fill="#1f2937">시험 대상 보드</text>
<text x="570" y="110" text-anchor="middle" fill="#4b5563">DUT</text>
<text x="570" y="128" text-anchor="middle" fill="#4b5563">(MCU 보드, 제어기,</text>
<text x="570" y="146" text-anchor="middle" fill="#4b5563">임베디드 리눅스)</text>
<line x1="430" y1="80" x2="488" y2="80" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="102" x2="488" y2="102" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="430" y1="124" x2="488" y2="124" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="146" x2="488" y2="146" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="258" y="220" width="392" height="160" rx="8" fill="#fafafa" stroke="#d1d5db"/>
<text x="274" y="246" font-weight="600" fill="#1f2937">러너와 보드 사이의 연결</text>
<text x="274" y="272" fill="#4b5563">① 디버그 프로브 (SWD/JTAG): 플래시, 강제 리셋</text>
<text x="274" y="296" fill="#4b5563">② USB 시리얼: 시험 명령, 로그 수집</text>
<text x="274" y="320" fill="#4b5563">③ 전원 릴레이 (USB 허브 포트 제어): 전원 차단 시험</text>
<text x="274" y="344" fill="#4b5563">④ 계측·자극: GPIO, CAN, ADC, 센서 신호</text>
<text x="274" y="368" fill="#6b7280" font-size="11">위 화살표는 위에서부터 ①②③④ 순서입니다.</text>
<rect x="20" y="220" width="200" height="160" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="120" y="246" text-anchor="middle" font-weight="600" fill="#991b1b">가장 큰 위험</text>
<text x="32" y="272" fill="#7f1d1d" font-size="12">외부인의 풀 리퀘스트가</text>
<text x="32" y="292" fill="#7f1d1d" font-size="12">이 러너에서 실행되는 것.</text>
<text x="32" y="318" fill="#7f1d1d" font-size="12">HIL 작업은 main 브랜치,</text>
<text x="32" y="338" fill="#7f1d1d" font-size="12">또는 담당자 승인 후에만</text>
<text x="32" y="358" fill="#7f1d1d" font-size="12">실행되게 제한합니다.</text>
</svg>
