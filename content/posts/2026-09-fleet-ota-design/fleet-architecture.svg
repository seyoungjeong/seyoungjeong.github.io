<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="690" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="20" y="20" width="190" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="115" y="45" text-anchor="middle" font-weight="600" fill="#1f2937">빌드와 서명</text>
<text x="115" y="67" text-anchor="middle" fill="#4b5563">재현 가능한 빌드, 델타 생성</text>
<text x="115" y="85" text-anchor="middle" fill="#4b5563">HSM/KMS 서명, 승인 절차</text>
<text x="115" y="103" text-anchor="middle" fill="#4b5563" font-size="11">SBOM, 변경 기록</text>
<rect x="250" y="20" width="190" height="96" rx="8" fill="#ecfdf3" stroke="#2f9e5b"/>
<text x="345" y="45" text-anchor="middle" font-weight="600" fill="#1f2937">배포 관리 (캠페인)</text>
<text x="345" y="67" text-anchor="middle" fill="#4b5563">대상 그룹, 단계(웨이브)</text>
<text x="345" y="85" text-anchor="middle" fill="#4b5563">속도 제한, 자동 중단 기준</text>
<text x="345" y="103" text-anchor="middle" fill="#4b5563" font-size="11">예: AWS IoT Jobs, Mender, hawkBit</text>
<rect x="480" y="20" width="190" height="96" rx="8" fill="#fff5e6" stroke="#d98a1c"/>
<text x="575" y="45" text-anchor="middle" font-weight="600" fill="#1f2937">모니터링</text>
<text x="575" y="67" text-anchor="middle" fill="#4b5563">웨이브별 성공·실패·롤백률</text>
<text x="575" y="85" text-anchor="middle" fill="#4b5563">버전 분포, 알림</text>
<text x="575" y="103" text-anchor="middle" fill="#4b5563" font-size="11">기준을 넘으면 캠페인 중단</text>
<line x1="212" y1="68" x2="248" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<line x1="478" y1="68" x2="442" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="180" width="260" height="84" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="190" y="205" text-anchor="middle" font-weight="600" fill="#1f2937">데이터 채널 (CDN)</text>
<text x="190" y="227" text-anchor="middle" fill="#4b5563">큰 파일: 이미지, 델타</text>
<text x="190" y="245" text-anchor="middle" fill="#4b5563">짧게 유효한 서명 URL, 이어받기</text>
<rect x="370" y="180" width="260" height="84" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="500" y="205" text-anchor="middle" font-weight="600" fill="#1f2937">제어 채널 (MQTT)</text>
<text x="500" y="227" text-anchor="middle" fill="#4b5563">작은 메시지: "업데이트가 있다"</text>
<text x="500" y="245" text-anchor="middle" fill="#4b5563">상태 보고: 설치, 헬스 체크, 롤백</text>
<line x1="115" y1="118" x2="160" y2="178" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="148" y="148" fill="#6b7280" font-size="11">이미지 업로드</text>
<line x1="345" y1="118" x2="450" y2="178" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="378" y="150" text-anchor="end" fill="#6b7280" font-size="11">작업 생성</text>
<line x1="590" y1="178" x2="590" y2="120" stroke="#d98a1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="598" y="152" fill="#b45309" font-size="11">보고</text>
<rect x="60" y="320" width="570" height="120" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="6 4"/>
<text x="76" y="342" fill="#6b7280" font-size="12">장비 수백만 대 (하드웨어 리비전, 지역, 고객별 그룹)</text>
<rect x="80" y="354" width="160" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="160" y="378" text-anchor="middle" font-weight="600" fill="#1f2937">업데이트 에이전트</text>
<text x="160" y="398" text-anchor="middle" fill="#4b5563" font-size="12">무작위 지연, 조건 확인</text>
<text x="160" y="414" text-anchor="middle" fill="#4b5563" font-size="12">(전원, 사용 중 여부)</text>
<rect x="265" y="354" width="160" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="345" y="378" text-anchor="middle" font-weight="600" fill="#1f2937">A/B 설치</text>
<text x="345" y="398" text-anchor="middle" fill="#4b5563" font-size="12">서명·버전 확인</text>
<text x="345" y="414" text-anchor="middle" fill="#4b5563" font-size="12">비활성 슬롯에 기록</text>
<rect x="450" y="354" width="160" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="530" y="378" text-anchor="middle" font-weight="600" fill="#1f2937">헬스 체크</text>
<text x="530" y="398" text-anchor="middle" fill="#4b5563" font-size="12">통과해야 성공 보고</text>
<text x="530" y="414" text-anchor="middle" fill="#4b5563" font-size="12">실패하면 자동 롤백</text>
<line x1="190" y1="266" x2="190" y2="318" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<line x1="500" y1="266" x2="500" y2="318" stroke="#4b5563" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="242" y1="390" x2="263" y2="390" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<line x1="427" y1="390" x2="448" y2="390" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
</svg>
