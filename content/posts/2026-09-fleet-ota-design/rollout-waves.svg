<rect x="500" y="80" width="150" height="170" fill="#93c5fd"/>
<text x="575" y="72" text-anchor="middle" fill="#1f2937" font-size="12">100%</text>
<text x="575" y="170" text-anchor="middle" fill="#1e3a8a" font-size="12">속도 제한을 두고</text>
<text x="575" y="188" text-anchor="middle" fill="#1e3a8a" font-size="12">며칠에 걸쳐</text>
<line x1="130" y1="158" x2="130" y2="250" stroke="#d98a1c" stroke-dasharray="4 3"/>
