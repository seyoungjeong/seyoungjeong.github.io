<line x1="490" y1="158" x2="490" y2="250" stroke="#d98a1c" stroke-dasharray="4 3"/>
<text x="130" y="154" text-anchor="middle" fill="#b45309" font-size="11">관찰</text>
<text x="230" y="154" text-anchor="middle" fill="#b45309" font-size="11">관찰</text>
<text x="350" y="154" text-anchor="middle" fill="#b45309" font-size="11">관찰</text>
<text x="490" y="154" text-anchor="middle" fill="#b45309" font-size="11">관찰</text>
<rect x="150" y="92" width="190" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="245" y="111" text-anchor="middle" fill="#991b1b" font-size="12">실패·롤백률이 기준(예: 2%)을</text>
<text x="245" y="128" text-anchor="middle" fill="#991b1b" font-size="12">넘으면 캠페인 자동 중단</text>
<text x="20" y="316" fill="#4b5563" font-size="12">"성공"은 설치 완료가 아니라, 새 시스템이 헬스 체크를 통과했다는 장비의 보고입니다.</text>
