<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 330" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="690" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="20" y="30" font-weight="600" fill="#1f2937">단계적 배포: 각 웨이브 뒤에 관찰하고, 기준을 넘으면 멈춘다</text>
<line x1="40" y1="250" x2="660" y2="250" stroke="#9ca3af"/>
<line x1="40" y1="250" x2="40" y2="60" stroke="#9ca3af"/>
