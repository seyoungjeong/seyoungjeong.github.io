<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="560" height="300" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<line x1="40" y1="210" x2="530" y2="210" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="530" y="232" text-anchor="end" fill="#4b5563" font-size="11">시간</text>
<line x1="60" y1="200" x2="60" y2="220" stroke="#e0453a" stroke-width="3"/>
<text x="60" y="245" text-anchor="middle" fill="#1f2937">0 s</text>
<text x="60" y="262" text-anchor="middle" fill="#e0453a" font-size="11">RX 선 뽑음</text>
<rect x="60" y="150" width="120" height="40" rx="6" fill="#fff5e6" stroke="#d98a1c"/>
<text x="120" y="167" text-anchor="middle" fill="#1f2937" font-size="12">다음 점검까지</text>
<text x="120" y="182" text-anchor="middle" fill="#4b5563" font-size="11">최대 1 s</text>
<line x1="180" y1="200" x2="180" y2="220" stroke="#1f2937" stroke-width="2"/>
<text x="180" y="245" text-anchor="middle" fill="#1f2937">unhealthy</text>
<text x="180" y="262" text-anchor="middle" fill="#4b5563" font-size="11">실측 0.44~0.54 s</text>
<rect x="180" y="150" width="290" height="40" rx="6" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="325" y="167" text-anchor="middle" fill="#1f2937" font-size="12">I/O 카드 보류 1.2 s</text>
<text x="325" y="182" text-anchor="middle" fill="#4b5563" font-size="11">그동안 상태가 바뀌지 않는지 확인</text>
<line x1="470" y1="200" x2="470" y2="220" stroke="#2e8b57" stroke-width="3"/>
<text x="470" y="245" text-anchor="middle" fill="#2e8b57">전환</text>
<text x="470" y="262" text-anchor="middle" fill="#4b5563" font-size="11">실측 1.65~1.74 s</text>
<text x="280" y="50" text-anchor="middle" font-weight="600" fill="#1f2937">살아 있지만 고장 난 Active의 전환 과정</text>
<text x="280" y="75" text-anchor="middle" fill="#4b5563" font-size="12">Active는 heartbeat를 계속 보내므로 타임아웃으로는 잡히지 않습니다.</text>
<text x="280" y="95" text-anchor="middle" fill="#4b5563" font-size="12">자체 점검이 고장을 보고하고, I/O 카드가 판단합니다.</text>
</svg>
