<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="690" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="185" y="20" width="320" height="64" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="345" y="45" text-anchor="middle" font-weight="600" fill="#1f2937">① 번들 설치 (rauc install)</text>
<text x="345" y="66" text-anchor="middle" fill="#4b5563">서명 확인 → 실행 중이 아닌 슬롯에 기록</text>
<line x1="345" y1="86" x2="345" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<rect x="185" y="114" width="320" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="345" y="139" text-anchor="middle" font-weight="600" fill="#1f2937">② 재부팅: U-Boot가 새 슬롯 선택</text>
<text x="345" y="160" text-anchor="middle" fill="#4b5563">부팅할 때마다 남은 시도 횟수를 1 줄임 (3 → 2)</text>
<line x1="345" y1="180" x2="345" y2="206" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<rect x="185" y="208" width="320" height="82" rx="8" fill="#fff5e6" stroke="#d98a1c"/>
<text x="345" y="233" text-anchor="middle" font-weight="600" fill="#1f2937">③ 헬스 체크 (90초 안에)</text>
<text x="345" y="254" text-anchor="middle" fill="#4b5563">/data 마운트, eth0 있음,</text>
<text x="345" y="272" text-anchor="middle" fill="#4b5563">데모 페이지 응답, SSH 응답</text>
<line x1="265" y1="292" x2="150" y2="340" stroke="#2f9e5b" stroke-width="2" marker-end="url(#ar)"/>
<text x="175" y="310" text-anchor="end" fill="#047857" font-weight="600">통과</text>
<line x1="425" y1="292" x2="540" y2="340" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="515" y="310" fill="#b91c1c" font-weight="600">실패, 멈춤, 커널 패닉</text>
<rect x="20" y="342" width="260" height="96" rx="8" fill="#ecfdf3" stroke="#2f9e5b"/>
<text x="150" y="367" text-anchor="middle" font-weight="600" fill="#1f2937">boot-complete.target 도달</text>
<text x="150" y="388" text-anchor="middle" fill="#4b5563">RAUC가 슬롯을 good으로 표시</text>
<text x="150" y="406" text-anchor="middle" fill="#4b5563">시도 횟수를 다시 3으로</text>
<text x="150" y="427" text-anchor="middle" fill="#047857" font-size="12">업데이트 완료</text>
<rect x="410" y="342" width="260" height="110" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="540" y="367" text-anchor="middle" font-weight="600" fill="#1f2937">기록 후 재부팅</text>
<text x="540" y="388" text-anchor="middle" fill="#4b5563">(헬스 실패, 워치독, panic=5)</text>
<text x="540" y="406" text-anchor="middle" fill="#4b5563">②로 돌아가 다시 시도.</text>
<text x="540" y="424" text-anchor="middle" fill="#4b5563">시도가 0이 되면 U-Boot가</text>
<text x="540" y="442" text-anchor="middle" fill="#b91c1c" font-size="12">이전 슬롯으로 부팅 (롤백)</text>
<path d="M 672 380 C 690 300, 690 150, 507 146" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
</svg>
