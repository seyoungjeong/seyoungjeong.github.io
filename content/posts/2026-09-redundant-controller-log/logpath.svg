<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="-apple-system, Segoe UI, sans-serif" font-size="13">
<rect width="660" height="260" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="15" y="20" width="440" height="165" rx="8" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="27" y="40" fill="#6b7280" font-size="12">Raspberry Pi (rc-a, rc-b 각각)</text>
<rect x="30" y="60" width="150" height="70" rx="8" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="105" y="88" text-anchor="middle" font-weight="600" fill="#1f2937">rc-central</text>
<text x="105" y="106" text-anchor="middle" fill="#4b5563" font-size="11">실시간 제어 (SCHED_FIFO)</text>
<text x="105" y="121" text-anchor="middle" fill="#4b5563" font-size="11">파일을 만지지 않음</text>
<line x1="184" y1="95" x2="282" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="233" y="84" text-anchor="middle" fill="#4b5563" font-size="11">64 B 레코드</text>
<text x="233" y="112" text-anchor="middle" fill="#4b5563" font-size="11">non-blocking</text>
<rect x="285" y="60" width="155" height="70" rx="8" fill="#fff5e6" stroke="#d98a1c"/>
<text x="362" y="88" text-anchor="middle" font-weight="600" fill="#1f2937">rc-logd</text>
<text x="362" y="106" text-anchor="middle" fill="#4b5563" font-size="11">수신 스레드 → 메모리</text>
<text x="362" y="121" text-anchor="middle" fill="#4b5563" font-size="11">쓰기 스레드 → SD 카드</text>
<line x1="362" y1="132" x2="362" y2="150" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="362" y="172" text-anchor="middle" fill="#1f2937" font-size="12">rc-log.bin (10 MiB 링 버퍼)</text>
<line x1="443" y1="95" x2="498" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
<text x="470" y="84" text-anchor="middle" fill="#4b5563" font-size="11">HTTP</text>
<rect x="500" y="60" width="145" height="70" rx="8" fill="#eefaf2" stroke="#2e8b57"/>
<text x="572" y="88" text-anchor="middle" font-weight="600" fill="#1f2937">Mac 뷰어</text>
<text x="572" y="106" text-anchor="middle" fill="#4b5563" font-size="11">두 로그를 합쳐</text>
<text x="572" y="121" text-anchor="middle" fill="#4b5563" font-size="11">한 타임라인으로</text>
<text x="330" y="225" text-anchor="middle" fill="#6b7280" font-size="12">모든 레코드에 I/O 카드의 시계(io_time)와 부팅 ID가 들어 있어</text>
<text x="330" y="243" text-anchor="middle" fill="#6b7280" font-size="12">두 제어기의 기록을 1 ms 단위로 맞출 수 있습니다.</text>
</svg>
